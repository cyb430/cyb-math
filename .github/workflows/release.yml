name: Publish release

on:
  workflow_dispatch:
    inputs:
      deploy_cloudflare:
        description: Deploy all sites and the download center
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CYB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CYB_ANDROID_KEYSTORE_PASSWORD }}
      CYB_ANDROID_KEY_ALIAS: ${{ secrets.CYB_ANDROID_KEY_ALIAS }}
      CYB_ANDROID_KEY_PASSWORD: ${{ secrets.CYB_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            work/cyb-math-exe-offline/package-lock.json
            work/cyb-math-apk-offline/package-lock.json
            work/cyb-math-download/package-lock.json
      - name: Restore Android signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.CYB_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'CYB_ANDROID_KEYSTORE_BASE64 is required' }
          $path = Join-Path $env:RUNNER_TEMP 'cyb-math-release.jks'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "CYB_ANDROID_KEYSTORE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build, test and prepare artifacts
        shell: pwsh
        run: ./scripts/release/prepare-release.ps1
      - name: Publish GitHub Release and production sites
        if: ${{ inputs.deploy_cloudflare == true }}
        shell: pwsh
        run: ./scripts/release/publish.ps1
      - name: Publish GitHub Release only
        if: ${{ inputs.deploy_cloudflare == false }}
        shell: pwsh
        run: ./scripts/release/publish.ps1 -SkipCloudflare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-files
          path: outputs/*
          if-no-files-found: error
